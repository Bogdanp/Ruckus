name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

env:
  CI_LIBFFI_VERSION: '3.4.6'
  CI_NOISE_BRANCH: racket-9.1-2
  CI_RACKET_VERSION: '9.1'

jobs:
  lint:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: Lint
        run: swiftlint lint --strict

  build-libffi:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Cache libffi
        id: cache-libffi
        uses: actions/cache@v5
        with:
          path: libffi-ios.tar.gz
          key: libffi-v${{ env.CI_LIBFFI_VERSION }}-ios
      - name: Build libffi
        if: steps.cache-libffi.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          brew install automake libtool
          git clone https://github.com/libffi/libffi
          cd libffi
          git checkout "v${CI_LIBFFI_VERSION}"
          ./autogen.sh
          python3 generate-darwin-source-and-headers.py --only-ios
          xcodebuild \
            -configuration release \
            -target libffi-iOS \
            -scheme libffi-iOS \
            -sdk "$(xcode-select -p)/Platforms/iPhoneOS.platform/Developer/SDKs/iPhoneOS.sdk" \
            -derivedDataPath dist \
            IPHONEOS_DEPLOYMENT_TARGET=12
      - name: Package libffi
        if: steps.cache-libffi.outputs.cache-hit != 'true'
        run: tar czf libffi-ios.tar.gz -C libffi/dist/Build/Products/Release-iphoneos .
      - uses: actions/upload-artifact@v7
        with:
          name: libffi-ios
          path: libffi-ios.tar.gz

  build-noise:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Cache Noise
        id: cache-noise
        uses: actions/cache@v5
        with:
          path: Noise
          key: noise-${{ env.CI_NOISE_BRANCH }}
      - name: Clone Noise
        if: steps.cache-noise.outputs.cache-hit != 'true'
        run: git clone --branch "$CI_NOISE_BRANCH" https://github.com/Bogdanp/Noise.git Noise
      - name: Build Noise
        if: steps.cache-noise.outputs.cache-hit != 'true'
        run: make -C Noise RacketCS-ios.xcframework RacketCS-macos.xcframework
      - uses: actions/upload-artifact@v7
        with:
          name: noise
          path: Noise

  build-pbracket:
    needs: build-libffi
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - name: Cache PB Racket
        id: cache-pb
        uses: actions/cache@v5
        with:
          path: racket
          key: pb-racket-v${{ env.CI_RACKET_VERSION }}-v4
      - name: Clone Racket
        if: steps.cache-pb.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "v${CI_RACKET_VERSION}" https://github.com/racket/racket.git
      - uses: actions/download-artifact@v8
        if: steps.cache-pb.outputs.cache-hit != 'true'
        with:
          name: libffi-ios
          path: /tmp
      - name: Unpack libffi
        if: steps.cache-pb.outputs.cache-hit != 'true'
        run: |
          mkdir -p libffi-ios
          tar xzf /tmp/libffi-ios.tar.gz -C libffi-ios
      - name: Build PB Racket
        if: steps.cache-pb.outputs.cache-hit != 'true'
        working-directory: racket
        run: |
          make fetch-pb
          mkdir -p racket/etc
          cat >racket/etc/config.rktd <<EOF
          #hash((default-scope . "installation"))
          EOF
          mkdir -p racket/src/build
          cd racket/src/build
          cat >libffi.pc <<EOF
          prefix=${GITHUB_WORKSPACE}/libffi-ios
          exec_prefix=\${prefix}
          libdir=\${exec_prefix}
          toolexeclibdir=\${libdir}
          includedir=\${prefix}/include/ffi

          Name: libffi
          Description: Library supporting Foreign Function Interfaces
          Version: ${CI_LIBFFI_VERSION}
          Libs: -L\${toolexeclibdir} -lffi
          Cflags: -I\${includedir}
          EOF
          env PKG_CONFIG_PATH="$(pwd)" \
            ../configure \
              --host=aarch64-apple-darwin \
              --enable-ios=iPhoneOS \
              --enable-pb \
              --enable-racket=auto \
              --enable-libffi \
              --enable-compressboot \
              --enable-strip
          make
          make install
      - name: Package PB Racket
        run: tar czf pbracket.tar.gz racket
      - uses: actions/upload-artifact@v7
        with:
          name: pbracket
          path: pbracket.tar.gz

  build-core:
    needs: [build-pbracket, build-noise]
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: Bogdanp/setup-racket@v1.15
        with:
          version: ${{ env.CI_RACKET_VERSION }}
          architecture: aarch64
      - uses: actions/download-artifact@v8
        with:
          name: noise
          path: ../Noise
      - uses: actions/download-artifact@v8
        with:
          name: pbracket
          path: /tmp
      - name: Unpack PB Racket
        run: tar xzf /tmp/pbracket.tar.gz
      - name: Set PBRACKET_ROOT
        run: echo "PBRACKET_ROOT=$GITHUB_WORKSPACE/racket" >> "$GITHUB_ENV"
      - name: Setup PB Racket
        run: ./bin/pbraco setup
      - name: Pin package catalogs
        run: |
          ./bin/pbraco pkg config --set catalogs \
             "https://download.racket-lang.org/releases/${CI_RACKET_VERSION}/catalog/" \
             https://pkgs.racket-lang.org \
             https://planet-compats.racket-lang.org
          ./bin/pbraco pkg config catalogs
      - name: Install ruckus-core
        run: |
          ./bin/pbraco pkg install --auto --skip-installed ../Noise/Racket/noise-serde-lib
          ./bin/pbraco pkg install --auto --skip-installed ./ruckus-core
      - name: Build core
        run: make
      - name: Prepare distribution
        run: ./bin/prepare-distribution
      - uses: actions/upload-artifact@v7
        with:
          name: ruckus-core
          path: |
            Ruckus/res/
            Ruckus/Backend.swift
            Ruckus/racket/

  build-test:
    needs: [build-core, build-noise]
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: ruckus-core
          path: Ruckus
      - uses: actions/download-artifact@v8
        with:
          name: noise
          path: ../Noise
      - name: Create Local.xcconfig
        run: echo 'DEVELOPMENT_TEAM = DUMMY' > xcconfigs/Local.xcconfig
      - name: Install tools
        run: brew install tuist swiftlint
      - name: Generate project
        run: tuist install && tuist generate --no-open
      - name: Build
        run: |
          set -o pipefail
          xcodebuild build -workspace Ruckus.xcworkspace -scheme Ruckus \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO | xcpretty
      - name: Test
        run: |
          set -o pipefail
          xcodebuild test -workspace Ruckus.xcworkspace -scheme Ruckus \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            -resultBundlePath TestResults.xcresult | xcpretty
      - name: Coverage summary
        run: xcrun xccov view --report TestResults.xcresult
      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          swift_project: Ruckus
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
