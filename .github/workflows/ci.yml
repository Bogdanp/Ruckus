name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  lint:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: Lint
        run: swiftlint lint --strict

  build-libffi:
    runs-on: macos-14
    steps:
      - name: Cache libffi
        id: cache-libffi
        uses: actions/cache@v5
        with:
          path: libffi-ios.tar.gz
          key: libffi-v3.4.6-ios
      - name: Build libffi
        if: steps.cache-libffi.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          brew install automake libtool
          git clone https://github.com/libffi/libffi
          cd libffi
          git checkout v3.4.6
          ./autogen.sh
          python3 generate-darwin-source-and-headers.py --only-ios
          xcodebuild \
            -configuration release \
            -target libffi-iOS \
            -scheme libffi-iOS \
            -sdk "$(xcode-select -p)/Platforms/iPhoneOS.platform/Developer/SDKs/iPhoneOS.sdk" \
            -derivedDataPath dist \
            IPHONEOS_DEPLOYMENT_TARGET=12
      - name: Package libffi
        if: steps.cache-libffi.outputs.cache-hit != 'true'
        run: tar czf libffi-ios.tar.gz -C libffi/dist/Build/Products/Release-iphoneos .
      - uses: actions/upload-artifact@v7
        with:
          name: libffi-ios
          path: libffi-ios.tar.gz

  build-core:
    needs: build-libffi
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6
      - uses: Bogdanp/setup-racket@v1.14
        with:
          version: '9.1'
          architecture: aarch64
      - name: Cache PB Racket
        id: cache-pb
        uses: actions/cache@v5
        with:
          path: racket
          key: pb-racket-v9.1-v3
      - name: Clone Racket
        if: steps.cache-pb.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch v9.1 https://github.com/racket/racket.git
      - uses: actions/download-artifact@v8
        if: steps.cache-pb.outputs.cache-hit != 'true'
        with:
          name: libffi-ios
          path: /tmp
      - name: Unpack libffi
        if: steps.cache-pb.outputs.cache-hit != 'true'
        run: |
          mkdir -p libffi-ios
          tar xzf /tmp/libffi-ios.tar.gz -C libffi-ios
      - name: Build PB Racket
        if: steps.cache-pb.outputs.cache-hit != 'true'
        working-directory: racket
        run: |
          make fetch-pb
          mkdir -p racket/etc
          cat >racket/etc/config.rktd <<EOF
          #hash((default-scope . "installation"))
          EOF
          mkdir -p racket/src/build
          cd racket/src/build
          cat >libffi.pc <<EOF
          prefix=${GITHUB_WORKSPACE}/libffi-ios
          exec_prefix=\${prefix}
          libdir=\${exec_prefix}
          toolexeclibdir=\${libdir}
          includedir=\${prefix}/include/ffi

          Name: libffi
          Description: Library supporting Foreign Function Interfaces
          Version: 3.4.6
          Libs: -L\${toolexeclibdir} -lffi
          Cflags: -I\${includedir}
          EOF
          env PKG_CONFIG_PATH="$(pwd)" \
            ../configure \
              --host=aarch64-apple-darwin \
              --enable-ios=iPhoneOS \
              --enable-pb \
              --enable-racket=auto \
              --enable-libffi \
              --enable-compressboot \
              --enable-strip
          make
          make install
      - name: Set PBRACKET_ROOT
        run: echo "PBRACKET_ROOT=$GITHUB_WORKSPACE/racket" >> "$GITHUB_ENV"
      - name: List PB Racket contents
        run: find racket/racket -maxdepth 2
      - name: Setup PB Racket
        run: ./bin/pbraco setup
      - name: Pin package catalogs
        run: |
          ./bin/pbraco pkg config --set catalogs \
             https://download.racket-lang.org/releases/9.1/catalog/ \
             https://pkgs.racket-lang.org \
             https://planet-compats.racket-lang.org
          ./bin/pbraco pkg config catalogs
      - name: Cache Noise
        uses: actions/cache@v5
        with:
          path: ../Noise
          key: noise-racket-9.1
      - name: Clone Noise
        run: |
          if [ ! -d ../Noise/.git ]; then
            git clone --branch racket-9.1 https://github.com/Bogdanp/Noise.git ../Noise
          fi
      - name: Install Noise packages
        run: ./bin/pbraco pkg install --auto -D ../Noise/Racket/noise-serde-lib
      - name: Install ruckus-core
        run: ./bin/pbraco pkg install --auto -D ./ruckus-core
      - name: Build core
        run: make
      - name: Prepare distribution
        run: ./bin/prepare-distribution
      - uses: actions/upload-artifact@v7
        with:
          name: ruckus-core
          path: |
            Ruckus/res/
            Ruckus/Backend.swift
            Ruckus/racket/

  build-test:
    needs: build-core
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: ruckus-core
          path: .
      - name: Cache Noise
        uses: actions/cache@v5
        with:
          path: ../Noise
          key: noise-racket-9.1
      - name: Clone Noise
        run: |
          if [ ! -d ../Noise/.git ]; then
            git clone --branch racket-9.1 https://github.com/Bogdanp/Noise.git ../Noise
          fi
      - name: Create Local.xcconfig
        run: echo 'DEVELOPMENT_TEAM = DUMMY' > xcconfigs/Local.xcconfig
      - name: Install Tuist
        run: brew install tuist
      - name: Generate project
        run: tuist install && tuist generate --no-open
      - name: Build
        run: |
          xcodebuild build -workspace Ruckus.xcworkspace -scheme Ruckus \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO | xcpretty
      - name: Test
        run: |
          xcodebuild test -workspace Ruckus.xcworkspace -scheme Ruckus \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' | xcpretty
